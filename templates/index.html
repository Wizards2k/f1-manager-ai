<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager AI - Monza Circuit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .circuit-container {
            width: 65%;
            position: relative;
            background: #0a0a0a;
        }
        
        #circuit-map {
            width: 100%;
            height: 100%;
        }
        
        .timing-container {
            width: 35%;
            background: #0f0f0f;
            border-left: 2px solid #333;
            padding: 20px;
            overflow-y: auto;
        }
        
        .timing-header {
            background: linear(135deg, #e10600 0%, #b80400 100%);
            padding: 10px;
            margin: -15px -15px 15px -15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 10px rgba(225, 6, 0, 0.3);
        }
        
        .session-timer {
            background: #1a1a1a;
            padding: 8px;
            margin: 0 0 15px 0;
            border-radius: 8px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            color: #00ff00;
            border: 1px solid #333;
        }
        
        .session-timer.warning {
            color: #ffaa00;
            border-color: #ffaa00;
        }
        
        .session-timer.danger {
            color: #ff4444;
            border-color: #ff4444;
            animation: pulse 1s infinite;
        }
        
        .speed-controls {
            background: #1a1a1a;
            padding: 10px;
            margin: 0 0 15px 0;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        
        .speed-buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 8px;
        }
        
        .speed-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .speed-btn:hover {
            background: #555;
            transform: translateY(-2px);
        }
        
        .speed-btn.active {
            background: #e10600;
            color: #fff;
            box-shadow: 0 2px 8px rgba(225, 6, 0, 0.5);
        }
        
        .pause-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 40px;
            font-size: 16px;
        }
        
        .pause-btn:hover {
            background: #555;
            transform: translateY(-1px);
        }
        
        .pause-btn.paused {
            background: #ff6600;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 102, 0, 0.5);
        }
        
        .current-speed {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
        }
        
        .position {
            width: 20px;
            font-weight: bold;
            font-size: 12px;
            color: #e10600;
            margin-right: 6px;
        }
        
        .driver-row {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            margin-bottom: 6px;
            background: #1a1a1a;
            border-radius: 6px;
            border-left: 3px solid;
            gap: 6px;
        }
        
        .driver-row:hover {
            background: #252525;
        }
        
        .driver-number {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            margin-right: 8px;
            border: 2px solid white;
        }
        
        .driver-info {
            flex: 1;
        }
        
        .driver-name {
            font-weight: bold;
            font-size: 12px;
        }
        
        .driver-team {
            font-size: 9px;
            color: #999;
        }
        
        .lap-times {
            display: flex;
            flex-direction: column;
            min-width: 140px;
        }
        
        .sector-times {
            display: flex;
            flex-direction: column;
            margin: 2px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            padding: 2px;
        }
        
        .sector-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            margin: 1px 0;
        }
        
        .sector-row span:first-child {
            color: #888;
            font-weight: bold;
            min-width: 15px;
        }
        
        .sector-time {
            font-family: 'Courier New', monospace;
            color: #00ff00;
            font-weight: bold;
            min-width: 35px;
            text-align: right;
            font-size: 8px;
        }
        
        .sector-best {
            font-family: 'Courier New', monospace;
            color: #e10600;
            font-size: 7px;
            margin-left: 2px;
            min-width: 35px;
            text-align: right;
        }
        
        .best-lap {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 10px;
            color: #e10600;
            margin-bottom: 1px;
        }
        
        .last-lap {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: #00ff00;
        }
        
        .lap-times small {
            font-size: 7px;
            color: #888;
            margin-left: 2px;
        }
        
        .lap-time {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            color: #00ff00;
        }
        
        .state-indicator {
            font-size: 8px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 4px;
            min-width: 35px;
            text-align: center;
        }
        
        .state-indicator.box {
            background: #333;
            color: #fff;
        }
        
        .state-indicator.out-lap {
            background: #ffaa00;
            color: #000;
        }
        
        .state-indicator.hot-lap {
            background: #00ff00;
            color: #000;
        }
        
        .state-indicator.in-lap {
            background: #ff6600;
            color: #fff;
        }
        
        .lap-count {
            font-size: 9px;
            color: #666;
            margin-left: 4px;
            min-width: 60px;
        }
        
        .session-laps {
            font-size: 8px;
            color: #888;
            margin-left: 2px;
        }
        
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff00;
            margin-left: 4px;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .circuit-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .circuit-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #e10600;
        }
        
        .circuit-details {
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circuit-container">
            <div id="circuit-map"></div>
            <div class="circuit-info">
                <div class="circuit-title">Autodromo Nazionale Monza</div>
                <div class="circuit-details">5.793 km • Temple of Speed</div>
            </div>
        </div>
        
        <div class="timing-container">
            <div class="timing-header">
                🏁 FREE PRACTICE - LIVE TIMING
            </div>
            <div class="session-timer" id="session-timer">
                60:00
            </div>
            <div class="speed-controls">
                <div class="speed-buttons">
                    <button class="pause-btn" id="pause-btn" title="Pause/Resume">⏸</button>
                    <button class="speed-btn active" data-speed="1">1x</button>
                    <button class="speed-btn" data-speed="2">2x</button>
                    <button class="speed-btn" data-speed="4">4x</button>
                    <button class="speed-btn" data-speed="6">6x</button>
                </div>
                <div class="current-speed" id="current-speed">Speed: 1x</div>
            </div>
            <div id="timing-table"></div>
        </div>
    </div>

    <script>
        // Inizializzazione mappa con controlli disabilitati
        const map = L.map('circuit-map', {
            center: [45.6216, 45.6216],
            zoom: 15,
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            doubleClickZoom: false,
            scrollWheelZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: false
        });
        
        // Tile layer dark theme
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        
        // Carica circuito
        fetch('/api/circuit')
            .then(response => response.json())
            .then(data => {
                const coordinates = data.features[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                
                // Disegna tracciato
                const circuitLine = L.polyline(coordinates, {
                    color: '#ffffff',
                    weight: 4,
                    opacity: 0.8
                }).addTo(map);
                
                // Adatta view al circuito
                map.fitBounds(circuitLine.getBounds(), { padding: [20, 20] });
                
                // Disegna bordo tracciato
                L.polyline(coordinates, {
                    color: '#e10600',
                    weight: 6,
                    opacity: 0.3
                }).addTo(map);
            });
        
        // Socket.IO per aggiornamenti real-time
        const socket = io();
        const carMarkers = {};
        const timingTable = document.getElementById('timing-table');
        
        // Formatta tempo
        function formatLapTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${mins}:${secs.padStart(6, '0')}`;
        }
        
        // Crea marker per auto
        function createCarMarker(car) {
            const icon = L.divIcon({
                className: 'car-marker',
                html: `<div style="
                    background: ${car.team_color};
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                    border: 2px solid white;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-weight: bold;
                    font-size: 10px;
                    color: white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                ">${car.driver_number}</div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            return L.marker([car.position[1], car.position[0]], { icon });
        }
        
        // Aggiorna tabella tempi
        function updateTimingTable(cars) {
            // Ordina per miglior tempo in sessione (best_lap_time)
            const sortedCars = [...cars].sort((a, b) => {
                if (!a.best_lap_time) return 1;
                if (!b.best_lap_time) return -1;
                return a.best_lap_time - b.best_lap_time;
            });
            
            timingTable.innerHTML = sortedCars.map((car, index) => {
                const isInBox = car.state === 'BOX';
                const stateClass = car.state ? car.state.toLowerCase().replace('_', '-') : 'box';
                
                return `
                    <div class="driver-row ${isInBox ? 'in-box' : 'on-track'}" style="border-left-color: ${car.team_color}">
                        <div class="position">${index + 1}</div>
                        <div class="driver-number" style="background: ${car.team_color}">
                            ${car.driver_number}
                        </div>
                        <div class="driver-info">
                            <div class="driver-name">${car.driver_name}</div>
                            <div class="driver-team">${car.team_name}</div>
                        </div>
                        <div class="lap-times">
                            <div class="best-lap">
                                ${car.best_lap_time ? formatLapTime(car.best_lap_time) : '--:--.---'}
                                <small>BEST</small>
                            </div>
                            <div class="sector-times">
                                <div class="sector-row">
                                    <span>S1:</span>
                                    <span class="sector-time">${car.current_lap_sectors?.sector1 ? formatSectorTime(car.current_lap_sectors.sector1) : '--:--'}</span>
                                    <span class="sector-best">${car.best_sectors?.sector1 ? '(' + formatSectorTime(car.best_sectors.sector1) + ')' : ''}</span>
                                </div>
                                <div class="sector-row">
                                    <span>S2:</span>
                                    <span class="sector-time">${car.current_lap_sectors?.sector2 ? formatSectorTime(car.current_lap_sectors.sector2) : '--:--'}</span>
                                    <span class="sector-best">${car.best_sectors?.sector2 ? '(' + formatSectorTime(car.best_sectors.sector2) + ')' : ''}</span>
                                </div>
                                <div class="sector-row">
                                    <span>S3:</span>
                                    <span class="sector-time">${car.current_lap_sectors?.sector3 ? formatSectorTime(car.current_lap_sectors.sector3) : '--:--'}</span>
                                    <span class="sector-best">${car.best_sectors?.sector3 ? '(' + formatSectorTime(car.best_sectors.sector3) + ')' : ''}</span>
                                </div>
                            </div>
                            <div class="last-lap">
                                ${car.last_lap_time ? formatLapTime(car.last_lap_time) : '--:--.---'}
                                <small>LAST</small>
                                ${car.last_lap_type && car.last_lap_type !== 'HOT_LAP' ? `<small style="color: #888;">(${car.last_lap_type})</small>` : ''}
                            </div>
                        </div>
                        <div class="lap-count">
                            Lap ${car.total_laps}
                            <span class="session-laps">(${car.session_laps} total)</span>
                        </div>
                        <div class="state-indicator ${stateClass}">
                            ${car.state || 'BOX'}
                        </div>
                        <div class="status-indicator"></div>
                    </div>
                `;
            }).join('');
        }
        
        // Ricevi aggiornamenti
        socket.on('race_update', function(data) {
            data.cars.forEach(car => {
                if (!carMarkers[car.driver_number]) {
                    carMarkers[car.driver_number] = createCarMarker(car);
                    carMarkers[car.driver_number].addTo(map);
                } else {
                    carMarkers[car.driver_number].setLatLng([car.position[1], car.position[0]]);
                }
            });
            
            updateTimingTable(data.cars);
            updateSessionTimer(data.session_time_remaining, data.session_time_formatted);
            updateSpeedIndicator(data.game_speed);
            updatePauseButton(data.is_paused);
        });
        
        // Aggiorna timer della sessione
        function updateSessionTimer(remaining, formatted) {
            const timerElement = document.getElementById('session-timer');
            timerElement.textContent = formatted;
            
            // Cambia colore in base al tempo rimanente
            timerElement.classList.remove('warning', 'danger');
            if (remaining < 300) { // Meno di 5 minuti
                timerElement.classList.add('danger');
            } else if (remaining < 900) { // Meno di 15 minuti
                timerElement.classList.add('warning');
            }
        }
        
        // Aggiorna indicatore velocità
        function updateSpeedIndicator(speed) {
            document.getElementById('current-speed').textContent = `Speed: ${speed}x`;
            
            // Aggiorna stato pulsanti
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseFloat(btn.dataset.speed) === speed) {
                    btn.classList.add('active');
                }
            });
        }
        
        // Aggiorna pulsante pausa
        function updatePauseButton(isPaused) {
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.textContent = '▶';
                pauseBtn.classList.add('paused');
                pauseBtn.title = 'Resume';
            } else {
                pauseBtn.textContent = '⏸';
                pauseBtn.classList.remove('paused');
                pauseBtn.title = 'Pause';
            }
        }
        
        // Pulsante pausa
        document.getElementById('pause-btn').addEventListener('click', async function() {
            try {
                const response = await fetch('/api/toggle_pause', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                updatePauseButton(data.is_paused);
                console.log(data.message);
                
            } catch (error) {
                console.error('Error toggling pause:', error);
            }
        });
        
        // Controlli velocità
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const speed = parseFloat(this.dataset.speed);
                console.log('Setting speed to:', speed);
                
                try {
                    const response = await fetch('/api/set_speed', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ speed: speed })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    updateSpeedIndicator(speed);
                    console.log('Speed changed successfully:', data.message);
                    
                } catch (error) {
                    console.error('Network error setting speed:', error);
                }
            });
        });
        
        // Funzione per formattare tempi settoriali
        function formatSectorTime(seconds) {
            if (!seconds) return '--:--';
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(3);
            return mins > 0 ? `${mins}:${secs.padStart(6, '0')}` : secs;
        }
        
        // Carica stato iniziale
        fetch('/api/cars')
            .then(response => response.json())
            .then(cars => {
                cars.forEach(car => {
                    carMarkers[car.driver_number] = createCarMarker(car);
                    carMarkers[car.driver_number].addTo(map);
                });
                updateTimingTable(cars);
            });
    </script>
</body>
</html>
