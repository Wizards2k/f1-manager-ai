<div class="timing-container">
    <div class="timing-header">
        <div class="header-content">
            <span class="session-title">FREE PRACTICE - LIVE TIMING</span>
            <div class="session-timer" id="session-timer">60:00</div>
        </div>
    </div>
    <div class="timing-toolbar">
        <div class="toolbar-row">
            <div class="speed-buttons">
                <button class="pause-btn" id="pause-btn" title="Pause/Resume">⏸</button>
                <button class="speed-btn active" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="2">2x</button>
                <button class="speed-btn" data-speed="4">4x</button>
                <button class="speed-btn" data-speed="6">6x</button>
                <button class="speed-btn save-btn" id="save-game-btn" title="Save Game" style="background: #28a745; margin-left:10px;">SAVE</button>
                <button class="speed-btn select-circuit-btn" id="select-circuit-btn" style="background: #e10600; margin-left:4px;">SELECT CIRCUIT</button>
            </div>
        </div>
        <div class="current-speed" id="current-speed">Speed: 1x</div>
    </div>

    <div class="timing-wrapper">
        <div id="timing-table"></div>
    </div>
</div>
