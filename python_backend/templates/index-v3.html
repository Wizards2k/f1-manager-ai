<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager AI - Circuit V3</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard-v3.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timing-panel-v3.css') }}">
</head>
<body>
    <div class="dashboard-v3">
        <!-- Game Area: Map + Dock -->
        <div class="game-area">
            <div class="map-area">
                <div id="circuit-map"></div>
            </div>
            <!-- Dock -->
            <div class="player-dock-v3" id="player-dock">
                <div class="garage-notifications-v3" id="garage-notifications"></div>
                <div id="player-car-cards-v3"></div>
            </div>
        </div>
        <!-- Timing Panel (Scoped legacy styles) -->
        <div class="timing-panel-v3" id="timing-panel">
            <div class="timing-panel-shell">
                <div class="timing-header">
                    <div class="header-content">
                        <span class="session-title">FREE PRACTICE - LIVE TIMING</span>
                        <div class="session-timer" id="session-timer">60:00</div>
                    </div>
                </div>
                <div class="timing-toolbar">
                    <div class="toolbar-row">
                        <div class="speed-buttons">
                            <button class="pause-btn" id="pause-btn" title="Pause/Resume">⏸</button>
                            <button class="speed-btn active" data-speed="1">1x</button>
                            <button class="speed-btn" data-speed="5">5x</button>
                            <button class="speed-btn" data-speed="15">15x</button>
                            <button class="speed-btn" data-speed="30">30x</button>
                            <button class="speed-btn circuit-select-btn" id="select-circuit-btn">Select Circuit</button>
                        </div>
                    </div>
                    <div class="current-speed" id="current-speed">Speed: 1x</div>
                </div>

                <div class="timing-wrapper">
                    <div id="timing-table"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Setup Modal Overlay -->
    <div class="player-setup-overlay-v3" id="player-setup-overlay"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/dashboard-v3.js') }}"></script>
</body>
</html>
