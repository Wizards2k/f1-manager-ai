<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager AI - Circuit V3</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard-v3.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timing-panel-v3.css') }}">
</head>
<body>
    <div class="dashboard-v3">
        <!-- Game Area: Map + Dock -->
        <div class="game-area">
            <div class="map-area">
                <div id="circuit-map"></div>
                <div class="hud-overlay" id="hud-overlay"></div>
                <button class="timeline-toggle-btn" id="timeline-toggle" aria-expanded="false" aria-controls="timeline-panel">
                    <span class="toggle-label">Timeline</span>
                    <span class="toggle-indicator">⟲</span>
                </button>
                <section class="timeline-panel-v3" id="timeline-panel" aria-hidden="true">
                    <header class="timeline-panel-header">
                        <div>
                            <p class="timeline-label">Live Feed</p>
                            <h4>Timeline eventi</h4>
                        </div>
                        <div class="timeline-actions">
                            <button class="timeline-clear-btn" id="timeline-clear" title="Svuota timeline">Clear</button>
                            <button class="timeline-close-btn" data-action="close-timeline" aria-label="Chiudi timeline">×</button>
                        </div>
                    </header>
                    <div class="timeline-panel-body">
                        <div class="timeline-list" id="timeline-list"></div>
                        <div class="timeline-empty" id="timeline-empty">Nessun evento ancora.</div>
                    </div>
                </section>
            </div>
            <!-- Dock -->
            <div class="player-dock-v3" id="player-dock">
                <div class="garage-status-line" id="garage-status"></div>
                <div class="garage-notifications-v3" id="garage-notifications"></div>
                <div id="player-car-cards-v3"></div>
            </div>
        </div>
        <!-- Timing Panel (Scoped legacy styles) -->
        <div class="timing-panel-v3" id="timing-panel">
            <div class="timing-panel-shell">
                <div class="timing-header">
                    <div class="header-content">
                        <span class="session-title">LIVE TIMING</span>
                        <div class="session-timer" id="session-timer">60:00</div>
                    </div>
                </div>
                <div class="timing-toolbar">
                    <div class="toolbar-row">
                        <div class="speed-buttons">
                            <button class="pause-btn" id="pause-btn" title="Pause/Resume">⏸</button>
                            <button class="speed-btn active" data-speed="1">1x</button>
                            <button class="speed-btn" data-speed="2">2x</button>
                            <button class="speed-btn" data-speed="4">4x</button>
                            <button class="speed-btn" data-speed="6">6x</button>
                            <button class="speed-btn save-btn" id="save-game-btn" title="Save Session" style="background: #28a745; margin-left:8px; padding: 0 12px; height: 34px; white-space: nowrap; font-size: 11px;">SAVE</button>
                            <button class="speed-btn circuit-select-btn" id="select-circuit-btn" style="margin-left:4px; padding: 0 12px; height: 34px; white-space: nowrap; font-size: 11px;">SELECT CIRCUIT</button>
                        </div>
                    </div>
                    <div class="current-speed" id="current-speed">Speed: 1x</div>
                </div>

                <div class="timing-wrapper">
                    <div id="timing-table"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Setup Modal Overlay -->
    <div class="player-setup-overlay-v3" id="player-setup-overlay"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/dashboard-v3.js') }}"></script>
</body>
</html>
