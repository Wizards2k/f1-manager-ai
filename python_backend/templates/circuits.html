<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager AI - Select Circuit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
        }

        .f1-red { color: #e10600; }
        .f1-dark { background: #15151e; }
        .circuit-card {
            background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 1px solid #333;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .circuit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(224, 6, 0, 0.1), transparent);
            transition: left 0.5s;
        }

        .circuit-card:hover::before {
            left: 100%;
        }

        .circuit-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #e10600;
            box-shadow: 0 20px 40px rgba(224, 6, 0, 0.3);
            cursor: pointer;
        }

        /* Circuit Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #e10600;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            background: linear-gradient(90deg, #e10600 0%, #ff2d2d 100%);
            padding: 24px;
            border-radius: 14px 14px 0 0;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 32px;
        }

        .circuit-detail-preview {
            height: 200px;
            background: linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333),
                        linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 2px solid #333;
        }

        .circuit-detail-preview svg {
            width: 90%;
            height: 90%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .detail-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 24px 0;
        }

        .detail-stat {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .detail-stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e10600;
        }

        .detail-stat-label {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-top: 4px;
        }

        .play-button {
            background: linear-gradient(90deg, #e10600 0%, #ff2d2d 100%);
            color: white;
            border: none;
            padding: 18px 48px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(224, 6, 0, 0.4);
        }

        .flag-icon {
            width: 24px;
            height: 18px;
            border-radius: 2px;
            object-fit: cover;
        }

        .circuit-preview {
            height: 120px;
            background: linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333),
                        linear-gradient(45deg, #333 25%, transparent 25%, transparent 75%, #333 75%, #333);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circuit-preview svg {
            width: 80%;
            height: 80%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.75rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 16px;
            }
        }
    </style>
</head>
<body class="bg-black text-white">
    <!-- Header -->
    <header class="f1-dark border-b border-red-600 sticky top-0 z-50 backdrop-blur-lg bg-opacity-90">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-flag-checkered f1-red text-2xl"></i>
                    <h1 class="text-2xl font-bold">F1 Manager AI</h1>
                </div>
                <div class="flex items-center space-x-6">
                    <span class="text-sm text-gray-400">2025 Season</span>
                    <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold transition-colors">
                        <i class="fas fa-play mr-2"></i>Quick Race
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Title Section -->
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold mb-4 f1-red">Select Circuit</h2>
            <p class="text-gray-400 text-lg">Choose your battleground from the 2025 F1 calendar</p>
        </div>

        <!-- Filter Section -->
        <div class="flex justify-center mb-8">
            <div class="flex space-x-4 bg-gray-800 rounded-lg p-2">
                <button class="filter-btn px-4 py-2 rounded bg-red-600 text-white" data-filter="all">
                    All Circuits
                </button>
                <button class="filter-btn px-4 py-2 rounded hover:bg-gray-700 transition-colors" data-filter="europe">
                    Europe
                </button>
                <button class="filter-btn px-4 py-2 rounded hover:bg-gray-700 transition-colors" data-filter="asia">
                    Asia
                </button>
                <button class="filter-btn px-4 py-2 rounded hover:bg-gray-700 transition-colors" data-filter="americas">
                    Americas
                </button>
                <button class="filter-btn px-4 py-2 rounded hover:bg-gray-700 transition-colors" data-filter="middle-east">
                    Middle East
                </button>
            </div>
        </div>

        <!-- Circuits Grid -->
        <div id="circuits-grid" class="grid-container">
            <!-- Loading State -->
            <div class="col-span-full text-center py-12">
                <i class="fas fa-spinner fa-spin text-4xl f1-red mb-4"></i>
                <p class="text-gray-400 loading">Loading circuits...</p>
            </div>
        </div>

        <!-- Continue Section (New) -->
        <div id="continue-section" class="mt-12 hidden">
            <h1 class="text-3xl font-bold mb-8 flex items-center f1-red">
                <i class="fas fa-history mr-4"></i>RIPRENDI SESSIONE
            </h1>
            <div id="saves-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Saves will be injected here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="f1-dark border-t border-gray-800 mt-16">
        <div class="container mx-auto px-4 py-6">
            <div class="text-center text-gray-400 text-sm">
                <p>F1 Manager AI © 2025 | Official F1 2025 Season Simulator</p>
            </div>
        </div>
    </footer>

    <!-- Circuit Detail Modal -->
    <div id="circuit-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeCircuitModal()">
                    <i class="fas fa-times"></i>
                </button>
                <h2 id="modal-circuit-name" class="text-2xl font-bold"></h2>
                <div class="flex items-center mt-2 text-white/80">
                    <span id="modal-circuit-flag" class="text-2xl mr-2"></span>
                    <span id="modal-circuit-location"></span>
                </div>
            </div>
            <div class="modal-body">
                <div id="modal-circuit-preview" class="circuit-detail-preview"></div>
                
                <div class="detail-stats">
                    <div class="detail-stat">
                        <div id="modal-circuit-length" class="detail-stat-value"></div>
                        <div class="detail-stat-label">Length</div>
                    </div>
                    <div class="detail-stat">
                        <div id="modal-circuit-laps" class="detail-stat-value"></div>
                        <div class="detail-stat-label">Laps</div>
                    </div>
                    <div class="detail-stat">
                        <div id="modal-circuit-firstgp" class="detail-stat-value"></div>
                        <div class="detail-stat-label">First GP</div>
                    </div>
                    <div class="detail-stat">
                        <div id="modal-circuit-country" class="detail-stat-value" style="font-size: 1.2rem;"></div>
                        <div class="detail-stat-label">Country</div>
                    </div>
                </div>
                
                <p class="text-gray-400 text-center text-sm mb-4">
                    <i class="fas fa-info-circle mr-2"></i>
                    Click play to start a race at this circuit
                </p>
                
                <button id="modal-play-button" class="play-button" onclick="playCircuit()">
                    <i class="fas fa-play mr-3"></i>GIOCA
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='circuits/circuits_svg.js') }}"></script>
    <script>
        // Circuit data with real SVG previews from GeoJSON
        const circuits = [
            { id: 'au-1953_melbourne', name: 'Australian Grand Prix', location: 'Melbourne', country: 'Australia', flag: '🇦🇺', continent: 'asia', length: '5.278 km', firstGp: 1996, laps: 58 },
            { id: 'cn-2004_shanghai', name: 'Chinese Grand Prix', location: 'Shanghai', country: 'China', flag: '🇨🇳', continent: 'asia', length: '5.451 km', firstGp: 2004, laps: 56 },
            { id: 'jp-1962_suzuka', name: 'Japanese Grand Prix', location: 'Suzuka', country: 'Japan', flag: '🇯🇵', continent: 'asia', length: '5.807 km', firstGp: 1987, laps: 53 },
            { id: 'bh-2002_sakhir', name: 'Bahrain Grand Prix', location: 'Sakhir', country: 'Bahrain', flag: '🇧🇭', continent: 'middle-east', length: '5.412 km', firstGp: 2004, laps: 57 },
            { id: 'sa-2021_jeddah', name: 'Saudi Arabian Grand Prix', location: 'Jeddah', country: 'Saudi Arabia', flag: '🇸🇦', continent: 'middle-east', length: '6.174 km', firstGp: 2021, laps: 50 },
            { id: 'us-2022_miami', name: 'Miami Grand Prix', location: 'Miami', country: 'USA', flag: '🇺🇸', continent: 'americas', length: '5.410 km', firstGp: 2022, laps: 57 },
            { id: 'it-1953_imola', name: 'Emilia-Romagna Grand Prix', location: 'Imola', country: 'Italy', flag: '🇮🇹', continent: 'europe', length: '4.909 km', firstGp: 1980, laps: 63 },
            { id: 'mc-1929_monaco', name: 'Monaco Grand Prix', location: 'Monaco', country: 'Monaco', flag: '🇲🇨', continent: 'europe', length: '3.337 km', firstGp: 1929, laps: 78 },
            { id: 'es-1991_barcelona', name: 'Spanish Grand Prix', location: 'Barcelona', country: 'Spain', flag: '🇪🇸', continent: 'europe', length: '4.655 km', firstGp: 1991, laps: 66 },
            { id: 'ca-1978_montreal', name: 'Canadian Grand Prix', location: 'Montreal', country: 'Canada', flag: '🇨🇦', continent: 'americas', length: '4.361 km', firstGp: 1978, laps: 70 },
            { id: 'at-1969_spielberg', name: 'Austrian Grand Prix', location: 'Spielberg', country: 'Austria', flag: '🇦🇹', continent: 'europe', length: '4.318 km', firstGp: 1970, laps: 71 },
            { id: 'gb-1948_silverstone', name: 'British Grand Prix', location: 'Silverstone', country: 'UK', flag: '🇬🇧', continent: 'europe', length: '5.891 km', firstGp: 1950, laps: 52 },
            { id: 'be-1925_spa_francorchamps', name: 'Belgian Grand Prix', location: 'Spa-Francorchamps', country: 'Belgium', flag: '🇧🇪', continent: 'europe', length: '7.004 km', firstGp: 1950, laps: 44 },
            { id: 'hu-1986_budapest', name: 'Hungarian Grand Prix', location: 'Budapest', country: 'Hungary', flag: '🇭🇺', continent: 'europe', length: '4.381 km', firstGp: 1986, laps: 70 },
            { id: 'nl-1948_zandvoort', name: 'Dutch Grand Prix', location: 'Zandvoort', country: 'Netherlands', flag: '🇳🇱', continent: 'europe', length: '4.259 km', firstGp: 1952, laps: 72 },
            { id: 'it-1922_monza', name: 'Italian Grand Prix', location: 'Monza', country: 'Italy', flag: '🇮🇹', continent: 'europe', length: '5.793 km', firstGp: 1950, laps: 53 },
            { id: 'sg-2008_singapore', name: 'Singapore Grand Prix', location: 'Singapore', country: 'Singapore', flag: '🇸🇬', continent: 'asia', length: '4.928 km', firstGp: 2008, laps: 62 },
            { id: 'us-2012_austin', name: 'United States Grand Prix', location: 'Austin', country: 'USA', flag: '🇺🇸', continent: 'americas', length: '5.514 km', firstGp: 2012, laps: 56 },
            { id: 'mx-1962_mexico_city', name: 'Mexican Grand Prix', location: 'Mexico City', country: 'Mexico', flag: '🇲🇽', continent: 'americas', length: '4.304 km', firstGp: 1963, laps: 71 },
            { id: 'br-1940_sao_paulo', name: 'Brazilian Grand Prix', location: 'São Paulo', country: 'Brazil', flag: '🇧🇷', continent: 'americas', length: '4.309 km', firstGp: 1973, laps: 71 },
            { id: 'qa-2004_lusail', name: 'Qatar Grand Prix', location: 'Lusail', country: 'Qatar', flag: '🇶🇦', continent: 'middle-east', length: '5.418 km', firstGp: 2021, laps: 57 },
            { id: 'az-2016_baku', name: 'Azerbaijan Grand Prix', location: 'Baku', country: 'Azerbaijan', flag: '🇦🇿', continent: 'middle-east', length: '6.003 km', firstGp: 2017, laps: 51 },
            { id: 'us-2023_las_vegas', name: 'Las Vegas Grand Prix', location: 'Las Vegas', country: 'USA', flag: '🇺🇸', continent: 'americas', length: '6.201 km', firstGp: 2023, laps: 50 },
            { id: 'ae-2009_yas_marina', name: 'Abu Dhabi Grand Prix', location: 'Abu Dhabi', country: 'UAE', flag: '🇦🇪', continent: 'middle-east', length: '5.281 km', firstGp: 2009, laps: 58 }
        ];

        let currentFilter = 'all';

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            renderCircuits();
            setupFilters();
            loadSaves();
        });

        // Load available saves
        async function loadSaves() {
            try {
                const response = await fetch('/api/saves');
                const saves = await response.json();
                
                const continueSection = document.getElementById('continue-section');
                const savesGrid = document.getElementById('saves-grid');
                
                if (saves && saves.length > 0) {
                    continueSection.classList.remove('hidden');
                    savesGrid.innerHTML = saves.map(save => {
                        const date = new Date(save.timestamp).toLocaleString();
                        return `
                            <div class="circuit-card rounded-xl p-6 border-l-4 border-green-500" onclick="loadSave('${save.id}')">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h4 class="font-bold text-xl text-white">${save.name}</h4>
                                        <p class="text-sm text-gray-400">${date}</p>
                                    </div>
                                    <span class="bg-green-600/20 text-green-500 px-2 py-1 rounded text-xs font-bold uppercase tracking-wider">
                                        Snapshot
                                    </span>
                                </div>
                                <div class="flex items-center text-gray-300 text-sm">
                                    <i class="fas fa-map-marker-alt mr-2 text-red-500"></i>
                                    <span>${save.circuit_id.replace(/_/g, ' ')}</span>
                                </div>
                                <div class="mt-4 flex items-center text-green-500 text-sm font-bold">
                                    <i class="fas fa-play-circle mr-2"></i>RIPRENDI ORA
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    continueSection.classList.add('hidden');
                }
            } catch (err) {
                console.error('Failed to load saves', err);
            }
        }

        async function loadSave(saveId) {
            if (!confirm('Vuoi caricare questo salvataggio? La sessione attuale andrà persa.')) return;
            
            try {
                const response = await fetch('/api/load', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ save_id: saveId })
                });
                
                if (!response.ok) throw new Error('Failed to load save');
                
                const data = await response.json();
                
                // Redirect to race page
                // We need to know which circuit to load on the frontend side for the map
                // But the backend already fixed the bridge.
                // We'll just redirect to /circuit (or whatever handles the race)
                // Redirect to race page with correct circuit ID
                if (data.circuit_id) {
                    window.location.href = `/circuit?circuit=${data.circuit_id}&loaded=true`;
                } else {
                    window.location.href = `/circuit`; 
                }
            } catch (err) {
                alert('Errore nel caricamento del salvataggio');
                console.error(err);
            }
        }

        // Render circuits grid
        function renderCircuits(filter = 'all') {
            const grid = document.getElementById('circuits-grid');
            const filteredCircuits = filter === 'all' 
                ? circuits 
                : circuits.filter(c => c.continent === filter);

            grid.innerHTML = filteredCircuits.map(circuit => {
                // Get real SVG from circuitSvgs object
                const svg = circuitSvgs[circuit.id] || '<svg viewBox="0 0 200 120"><text x="100" y="60" text-anchor="middle" fill="#e10600" font-size="12">Circuit</text></svg>';
                
                return `
                <div class="circuit-card rounded-xl p-6" onclick="showCircuitDetail('${circuit.id}')">
                    <div class="circuit-preview rounded-lg mb-4 flex items-center justify-center">
                        ${svg}
                    </div>
                    
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-lg font-bold">${circuit.name}</h3>
                        <span class="text-2xl">${circuit.flag}</span>
                    </div>
                    
                    <div class="text-gray-400 text-sm mb-3">
                        <i class="fas fa-map-marker-alt mr-2"></i>${circuit.location}
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-item">
                            <i class="fas fa-road mr-1 text-xs"></i>
                            <span>${circuit.length}</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-flag-checkered mr-1 text-xs"></i>
                            <span>${circuit.laps} laps</span>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        // Setup filter buttons
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterButtons.forEach(b => {
                        b.classList.remove('bg-red-600', 'text-white');
                        b.classList.add('hover:bg-gray-700');
                    });
                    btn.classList.add('bg-red-600', 'text-white');
                    btn.classList.remove('hover:bg-gray-700');
                    
                    // Apply filter
                    currentFilter = btn.dataset.filter;
                    renderCircuits(currentFilter);
                });
            });
        }

        // Show circuit detail modal
        function showCircuitDetail(circuitId) {
            const circuit = circuits.find(c => c.id === circuitId);
            if (!circuit) return;
            
            // Populate modal
            document.getElementById('modal-circuit-name').textContent = circuit.name;
            document.getElementById('modal-circuit-flag').textContent = circuit.flag;
            document.getElementById('modal-circuit-location').textContent = circuit.location;
            document.getElementById('modal-circuit-length').textContent = circuit.length;
            document.getElementById('modal-circuit-laps').textContent = circuit.laps;
            document.getElementById('modal-circuit-firstgp').textContent = circuit.firstGp;
            document.getElementById('modal-circuit-country').textContent = circuit.country;
            
            // Set SVG preview
            const svg = circuitSvgs[circuit.id] || '<svg viewBox="0 0 200 120"><text x="100" y="60" text-anchor="middle" fill="#e10600" font-size="12">Circuit</text></svg>';
            document.getElementById('modal-circuit-preview').innerHTML = svg;
            
            // Store current circuit for play button
            document.getElementById('modal-play-button').dataset.circuitId = circuitId;
            
            // Show modal
            document.getElementById('circuit-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Close circuit modal
        function closeCircuitModal() {
            document.getElementById('circuit-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal when clicking overlay
        function closeModalOnOverlay(event) {
            if (event.target === event.currentTarget) {
                closeCircuitModal();
            }
        }

        // Play selected circuit
        function playCircuit() {
            const circuitId = document.getElementById('modal-play-button').dataset.circuitId;
            if (circuitId) {
                selectCircuit(circuitId);
            }
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCircuitModal();
            }
        });

        // Select circuit and redirect to race
        async function selectCircuit(circuitId) {
            console.log('Selected circuit:', circuitId);
            
            // Store selected circuit in localStorage
            localStorage.setItem('selectedCircuit', circuitId);
            
            // Find circuit data
            const circuit = circuits.find(c => c.id === circuitId);
            if (circuit) {
                // Store full circuit data
                localStorage.setItem('selectedCircuitData', JSON.stringify(circuit));
            }
            
            try {
                await fetch('/api/load_circuit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ circuit_id: circuitId })
                });
            } catch (err) {
                console.error('Failed to set circuit on backend', err);
            }

            // Redirect to V3 circuit page with circuit parameter
            window.location.href = `/circuit?circuit=${circuitId}`;
        }
    </script>
</body>
</html>
